name: Package YwCoder Web

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - win32
          - all
      upload_artifact:
        description: 'Upload build artifacts'
        required: false
        default: true
        type: boolean

jobs:
  package-linux:
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'
    # Run inside Rocky Linux 8 (glibc 2.28) so native modules compiled during the
    # build are linked against the same glibc version as the target server.
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8
    steps:
      - name: Install build tools
        run: |
          dnf install -y git-core python3 make gcc-c++ tar gzip curl
          git --version
          python3 --version
          gcc --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Verify Node runs on Rocky Linux 8
        run: node --version

      - name: Install root dependencies
        run: npm ci

      - name: Build YwCoder extension
        run: |
          cd extension
          npm ci
          npm run build

      - name: Build VS Code: web bundle and server
        run: |
          node build/next/index.ts bundle --nls --target web --out out-vscode-web
          node scripts/generate-nls-zh-cn.mjs
          node build/next/index.ts transpile --out out

      - name: Package Linux x64 with bundled glibc-2.17 Node
        run: node scripts/package-web-deployment.mjs --platform linux --arch x64 --download-node

      - name: Verify bundled Node binary and native modules
        run: |
          NODE_BIN="dist/ywcoder-web-linux-x64/node-runtime/bin/node"
          echo "Bundled Node version:"
          "$NODE_BIN" --version
          echo "Bundled Node max glibc requirement:"
          objdump -T "$NODE_BIN" | grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -5
          echo "Sample native module (spdlog) max glibc requirement:"
          find dist/ywcoder-web-linux-x64/node_modules -name 'spdlog.node' -print0 | head -z -n 1 | xargs -0 -r objdump -T | grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -5

      - name: Upload artifact
        if: github.event.inputs.upload_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ywcoder-web-linux-x64
          path: dist/ywcoder-web-linux-x64

  package-windows:
    if: github.event.inputs.platform == 'win32' || github.event.inputs.platform == 'all'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Install root dependencies
        run: npm ci

      - name: Build YwCoder extension
        run: |
          cd extension
          npm ci
          npm run build

      - name: Build VS Code: web bundle and server
        run: |
          node build/next/index.ts bundle --nls --target web --out out-vscode-web
          node scripts/generate-nls-zh-cn.mjs
          node build/next/index.ts transpile --out out

      - name: Package Windows x64 with bundled Node
        run: node scripts/package-web-deployment.mjs --platform win32 --arch x64 --download-node

      - name: Upload artifact
        if: github.event.inputs.upload_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ywcoder-web-win32-x64
          path: dist/ywcoder-web-win32-x64
