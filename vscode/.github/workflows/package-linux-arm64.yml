name: Package Linux arm64 Desktop

on:
  workflow_dispatch:
    inputs:
      quality:
        description: 'Build quality (e.g. ywcoder)'
        required: false
        default: 'ywcoder'
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master]

env:
  VSCODE_ARCH: arm64
  npm_config_arch: arm64
  VSCODE_QUALITY: ywcoder
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            build/package-lock.json
            package-lock.json

      - name: Install system dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            xvfb \
            libgtk-3-0 \
            libxkbfile-dev \
            libkrb5-dev \
            libgbm1 \
            rpm \
            bubblewrap \
            socat \
            fakeroot \
            dpkg-dev \
            python3 \
            python3-distutils \
            make \
            git

      - name: Install build dependencies
        run: |
          set -e
          cd build
          npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup cross-compilation environment
        run: |
          set -e
          source ./build/azure-pipelines/linux/setup-env.sh
          {
            echo "CC=$CC"
            echo "CXX=$CXX"
            echo "CXXFLAGS=$CXXFLAGS"
            echo "LDFLAGS=$LDFLAGS"
            echo "VSCODE_REMOTE_CC=$VSCODE_REMOTE_CC"
            echo "VSCODE_REMOTE_CXX=$VSCODE_REMOTE_CXX"
            echo "VSCODE_REMOTE_CXXFLAGS=$VSCODE_REMOTE_CXXFLAGS"
            echo "VSCODE_REMOTE_LDFLAGS=$VSCODE_REMOTE_LDFLAGS"
          } >> $GITHUB_ENV
        env:
          VSCODE_ARCH: arm64
          npm_config_arch: arm64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run preinstall
        run: node build/npm/preinstall.ts

      - name: Install dependencies
        run: |
          set -e
          for i in {1..3}; do
            npm ci && break
            if [ $i -eq 3 ]; then
              echo "npm install failed too many times" >&2
              exit 1
            fi
            echo "npm install failed attempt $i, retrying..."
          done
        env:
          npm_config_arch: arm64
          VSCODE_ARCH: arm64
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile and package desktop client
        run: npm run gulp vscode-linux-arm64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The upstream gulp task emits a folder named VSCode-<platform>-<arch>.
      # YwCoder's Linux packaging helpers expect YwCoder-linux-<arch>.
      - name: Rename client folder
        run: |
          set -e
          cd ..
          if [ -d VSCode-linux-arm64 ] && [ ! -d YwCoder-linux-arm64 ]; then
            mv VSCode-linux-arm64 YwCoder-linux-arm64
          fi

      - name: Build .deb package
        run: |
          set -e
          npm run gulp vscode-linux-arm64-prepare-deb
          npm run gulp vscode-linux-arm64-build-deb
          mkdir -p .build/linux/deb
          cp .build/linux/deb/arm64/deb/*.deb .build/linux/deb/ || true

      - name: Build .rpm package
        run: |
          set -e
          export STRIP="$PWD/.build/sysroots/glibc-2.28-gcc-10.5.0/aarch64-linux-gnu/aarch64-linux-gnu/bin/strip"
          npm run gulp vscode-linux-arm64-prepare-rpm
          npm run gulp vscode-linux-arm64-build-rpm
          mkdir -p .build/linux/rpm
          cp .build/linux/rpm/aarch64/*.rpm .build/linux/rpm/ || true

      - name: Archive client
        run: |
          set -e
          mkdir -p .build/linux/client
          tar -czf ".build/linux/client/YwCoder-linux-arm64-$(date +%s).tar.gz" -C .. YwCoder-linux-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ywcoder-linux-arm64
          path: |
            .build/linux/client/*.tar.gz
            .build/linux/deb/*.deb
            .build/linux/rpm/*.rpm
          if-no-files-found: ignore

      - name: Free disk space
        if: always()
        run: |
          set -e
          rm -rf .build/sysroots
          rm -rf .build/electron
          rm -rf out
          rm -rf out-build
          rm -rf out-vscode-min
          rm -rf out-vscode-reh-min
          rm -rf out-vscode-reh-web-min
          rm -rf ~/.cache/ms-playwright
