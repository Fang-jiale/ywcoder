name: Package YwCoder Web

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package-linux-x64:
    # Build in Rocky Linux 8 (glibc 2.28) so native modules are linked against the
    # same glibc version as the target Kylin V10 server.
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8
    defaults:
      run:
        working-directory: vscode
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      npm_config_python: /usr/bin/python3.9
      CC: /opt/rh/gcc-toolset-12/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-12/root/usr/bin/g++

    steps:
      - name: Check container OS, glibc and compiler
        working-directory: .
        run: |
          cat /etc/os-release
          ldd --version

      - name: Install build tools
        working-directory: .
        run: |
          dnf install -y gcc-toolset-12-gcc-c++ git-core python3 python39 make tar gzip curl binutils file krb5-devel
          echo "/opt/rh/gcc-toolset-12/root/usr/bin" >> "$GITHUB_PATH"
          ln -sf /usr/bin/python3.9 /usr/local/bin/python
          git --version
          python3.9 --version
          "$CC" --version
          "$CXX" --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Install root dependencies
        # vscode/.npmrc targets Electron 39 with build_from_source=true, but the
        # web server package only needs Node.js-compatible native modules. Use
        # prebuilt Node.js binaries where available to avoid dragging in desktop
        # build dependencies (gssapi/kerberos, etc.).
        env:
          npm_config_runtime: 'node'
          npm_config_target: '22.22.1'
          npm_config_disturl: 'https://nodejs.org/dist'
          npm_config_build_from_source: 'false'
        run: npm ci

      - name: Install server dependencies
        env:
          npm_config_build_from_source: 'true'
        run: npm ci --prefix remote --omit=dev

      - name: Install ywcoder extension dependencies
        working-directory: extension
        run: npm ci

      - name: Compile VS Code server and builtin extensions
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run compile

      - name: Build YwCoder extension
        working-directory: extension
        run: npm run build

      - name: Sync YwCoder extension to vscode/extensions/ywcoder
        working-directory: .
        run: |
          rm -rf vscode/extensions/ywcoder/dist
          cp -r extension/dist vscode/extensions/ywcoder/dist
          rm -rf vscode/extensions/ywcoder/resources
          cp -r extension/resources vscode/extensions/ywcoder/resources

      - name: Package deployment bundle
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          node scripts/package-web-deployment.mjs \
            --platform linux --arch x64 --download-node --skip-extension-build

      - name: Verify bundled Node binary and native modules
        working-directory: .
        run: .github/workflows/scripts/verify-glibc.sh vscode/dist/ywcoder-web-linux-x64

      - name: Create distribution archive
        run: node scripts/archive-web-deployment.mjs --platform linux --arch x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ywcoder-web-linux-x64
          path: vscode/dist/ywcoder-web-linux-x64.tar.gz
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-linux-x64
          path: |
            vscode/dist/ywcoder-web-linux-x64/server.log
            vscode/npm-debug.log
          if-no-files-found: ignore
