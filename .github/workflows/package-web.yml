name: Package YwCoder Web

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package-linux:
    # Build in Rocky Linux 8 (glibc 2.28) so native modules are linked against the
    # same glibc version as the target Kylin V10 server.
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: rockylinux:8
    defaults:
      run:
        working-directory: vscode
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      npm_config_python: /usr/bin/python3.9
      CC: /opt/rh/gcc-toolset-12/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-12/root/usr/bin/g++

    steps:
      - name: Check container OS, glibc and compiler
        working-directory: .
        run: |
          cat /etc/os-release
          ldd --version

      - name: Install build tools
        working-directory: .
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled powertools
          dnf install -y gcc-toolset-12-gcc-c++ git-core python3 python39 make cmake tar gzip curl binutils file pkgconfig krb5-devel libX11-devel libxkbfile-devel libnotify-devel libsecret-devel
          echo "/opt/rh/gcc-toolset-12/root/usr/bin" >> "$GITHUB_PATH"
          ln -sf /usr/bin/python3.9 /usr/local/bin/python
          git --version
          python3.9 --version
          "$CC" --version
          "$CXX" --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Install root dependencies
        # vscode/.npmrc targets Electron 39 with build_from_source=true, but the
        # web server package only needs Node.js-compatible native modules. Use
        # prebuilt Node.js binaries where available to avoid dragging in desktop
        # build dependencies (gssapi/kerberos, etc.).
        env:
          npm_config_runtime: 'node'
          npm_config_target: '22.22.1'
          npm_config_disturl: 'https://nodejs.org/dist'
          npm_config_build_from_source: 'false'
        run: |
          # VS Code's postinstall runs git config from vscode/, but git in the
          # container cannot locate the parent .git. Temporarily point vscode/
          # at the repository root .git so the postinstall script succeeds.
          trap 'rm -f .git' EXIT
          echo "gitdir: $GITHUB_WORKSPACE/.git" > .git
          npm ci

      - name: Install server dependencies
        env:
          npm_config_build_from_source: 'true'
        run: npm ci --prefix remote --omit=dev

      - name: Install ywcoder extension dependencies
        working-directory: extension
        run: npm ci

      - name: Compile VS Code server and builtin extensions
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run compile

      - name: Build YwCoder extension
        working-directory: extension
        run: npm run build

      - name: Sync YwCoder extension to vscode/extensions/ywcoder
        working-directory: .
        run: |
          rm -rf vscode/extensions/ywcoder/dist
          cp -r extension/dist vscode/extensions/ywcoder/dist
          rm -rf vscode/extensions/ywcoder/resources
          cp -r extension/resources vscode/extensions/ywcoder/resources
          # The extension is already bundled by esbuild; strip dependencies so
          # vsce's npm list check does not require node_modules here.
          node -e "
            const fs = require('fs');
            const p = 'vscode/extensions/ywcoder/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            delete pkg.dependencies;
            delete pkg.devDependencies;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Package deployment bundle
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          node scripts/package-web-deployment.mjs \
            --platform linux --arch ${{ matrix.arch }} --download-node --skip-extension-build

      - name: Verify bundled Node binary and native modules
        working-directory: .
        run: .github/workflows/scripts/verify-glibc.sh vscode/dist/ywcoder-web-linux-${{ matrix.arch }}

      - name: Create distribution archive
        run: node scripts/archive-web-deployment.mjs --platform linux --arch ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ywcoder-web-linux-${{ matrix.arch }}
          path: vscode/dist/ywcoder-web-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-linux-${{ matrix.arch }}
          path: |
            vscode/dist/ywcoder-web-linux-${{ matrix.arch }}/server.log
            vscode/npm-debug.log
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: package-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ywcoder-web-linux-x64
          path: release-assets

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ywcoder-web-linux-arm64
          path: release-assets

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "YwCoder Web ${{ github.ref_name }}" \
            --generate-notes || true
          gh release upload "${{ github.ref_name }}" release-assets/*.tar.gz --clobber
