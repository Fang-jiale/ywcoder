name: Package YwCoder Web (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package-win:
    name: Package Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: vscode
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      npm_config_runtime: 'node'
      npm_config_target: '22.22.1'
      npm_config_disturl: 'https://nodejs.org/dist'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Install root dependencies
        # Use prebuilt Node.js-compatible native modules to avoid desktop-only deps.
        env:
          npm_config_build_from_source: 'false'
        run: npm ci

      - name: Install server dependencies
        env:
          npm_config_build_from_source: 'true'
          npm_config_msvs_version: '2022'
        run: npm ci --prefix remote --omit=dev

      - name: Install ywcoder extension dependencies
        working-directory: extension
        run: npm ci

      - name: Compile VS Code server and builtin extensions
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run compile

      - name: Build YwCoder extension
        working-directory: extension
        run: npm run build

      - name: Sync YwCoder extension to vscode/extensions/ywcoder
        working-directory: .
        run: |
          rm -rf vscode/extensions/ywcoder/dist
          cp -r extension/dist vscode/extensions/ywcoder/dist
          rm -rf vscode/extensions/ywcoder/resources
          cp -r extension/resources vscode/extensions/ywcoder/resources
          # The extension is already bundled by esbuild; strip dependencies so
          # vsce's npm list check does not require node_modules here.
          node -e "
            const fs = require('fs');
            const p = 'vscode/extensions/ywcoder/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            delete pkg.dependencies;
            delete pkg.devDependencies;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Package deployment bundle
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          node scripts/package-web-deployment.mjs \
            --platform win32 --arch x64 --download-node --skip-extension-build

      - name: Verify bundled Node binary
        working-directory: .
        shell: pwsh
        run: |
          $nodeExe = "vscode/dist/ywcoder-web-win32-x64/node-runtime/node.exe"
          if (-not (Test-Path $nodeExe)) {
            Write-Error "Bundled Node.exe not found: $nodeExe"
            exit 1
          }
          & $nodeExe --version

      - name: Create distribution archive
        run: node scripts/archive-web-deployment.mjs --platform win32 --arch x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ywcoder-web-win32-x64
          path: vscode/dist/ywcoder-web-win32-x64.zip
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-win32-x64
          path: |
            vscode/dist/ywcoder-web-win32-x64/server.log
            vscode/npm-debug.log
          if-no-files-found: ignore

  release:
    name: Upload Windows assets to release
    needs: package-win
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ywcoder-web-win32-x64
          path: release-assets

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "YwCoder Web ${{ github.ref_name }}" \
            --generate-notes || true
          gh release upload "${{ github.ref_name }}" release-assets/*.zip --clobber
          gh release upload "${{ github.ref_name }}" vscode/deploy/web/README.md --clobber
